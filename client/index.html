  <body class="bg-stone-900 text-stone-100 font-sans antialiased selection:bg-rose-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Auto-recovery from stale Service Worker caches or outdated script hashes
      window.addEventListener('error', function (e) {
        if (e && e.message && (
          e.message.includes('Unexpected token') || 
          e.message.includes('dynamically imported') || 
          e.message.includes('Loading chunk') ||
          e.message.includes('Failed to fetch')
        )) {
          console.warn('Detectada discrepancia de caché. Actualizando caché y recargando...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (var reg of registrations) { reg.unregister(); }
              caches.keys().then(function (names) {
                for (var name of names) { caches.delete(name); }
                window.location.reload();
              });
            });
          }
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
